<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Blazing Blog{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ember: {
              50: '#fff4ed',
              100: '#ffe6d5',
              400: '#ff8a3d',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            },
            ink: {
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            },
            mist: {
              50: '#f8fafc',
              100: '#f1f5f9',
            },
          },
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Figtree', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #f8fafc;
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(249, 115, 22, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(234, 88, 12, 0.08), transparent),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      min-height: 100vh;
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-rise { animation: rise-in 0.55s ease-out both; }
    .animate-fade { animation: fade-in 0.4s ease-out both; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
  </style>
</head>
<body class="font-sans text-ink-800 antialiased">
  <header class="border-b border-slate-200/80 bg-white/70 backdrop-blur-md sticky top-0 z-40">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-4 px-5 py-4">
      <a href="/" class="group flex items-baseline gap-2">
        <span class="font-display text-2xl font-bold tracking-tight text-ink-900 group-hover:text-ember-600 transition-colors">
          Blazing
        </span>
        <span class="text-sm font-medium uppercase tracking-[0.2em] text-ember-600">Blog</span>
      </a>
      <nav class="flex items-center gap-1 sm:gap-3 text-sm font-medium">
        {% if user %}
          <a href="/posts/new" class="rounded-md bg-ember-600 px-3 py-1.5 text-white hover:bg-ember-700 transition-colors">
            New post
          </a>
          <span class="hidden sm:inline text-ink-700">{{ user.username }}</span>
          <form action="/logout" method="post" class="inline">
            <button type="submit" class="px-2 py-1.5 text-ink-700 hover:text-ember-600 transition-colors">
              Log out
            </button>
          </form>
        {% else %}
          <a href="/login" class="px-2 py-1.5 text-ink-700 hover:text-ember-600 transition-colors">Log in</a>
          <a href="/register" class="rounded-md bg-ember-600 px-3 py-1.5 text-white hover:bg-ember-700 transition-colors">
            Sign up
          </a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-5 py-10 sm:py-14">
    {% block content %}{% endblock %}
  </main>

  <footer class="mx-auto max-w-3xl px-5 pb-10 pt-4 text-center text-sm text-slate-500">
    Blazing Blog · FastAPI + SQLite
  </footer>
</body>
</html>
